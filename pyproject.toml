[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "safety: safety-critical 400V DC tests (run separately with -m safety)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
